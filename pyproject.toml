[build-system]
# Tells Python how to package your code behind the scenes
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"] 

[project]
# Core metadata about your project
name = "fmcw_processing"
version = "0.1.0"
description = "fmcw processing scripts"
requires-python = ">=3.10"

# Third-party libraries your modules and scripts depend on
dependencies = [
    "numpy>=2.2.5",
    "scipy>=1.15.3",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
# Optional groups of dependencies (e.g., only needed for development/testing)
dev = [
    "cvxpy>=1.7.5",
]
